[package]
name = "simply-midi-clock"
description = "MIDI beat clock out: the real-time messages, the follower's position, the sleep-then-spin pacing a clock follower needs, and output-port selection"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Open output ports through midir. Off for a consumer that only wants the
# messages and the pacing.
device = ["dep:midir"]

[dependencies]
midir = { version = "0.11.0", optional = true }
