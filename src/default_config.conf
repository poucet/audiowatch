# audiowatch configuration
#
# Lines are "<setting> <value>". Everything after a # is a comment.
# Restart audiowatch after editing (launchctl kickstart -k gui/$UID/local.audiowatch).
#
# ---------------------------------------------------------------------------
# TO STOP SOMETHING NOTIFYING YOU: add one line at the bottom of this file.
#
#   allow-exe    afplay                      # match the executable's file name
#   allow-path   /Applications/Thing.app/*   # match the full executable path
#   allow-bundle com.example.thing           # match the bundle id
#
# Patterns are case-insensitive; * matches anything, ? matches one character.
# An allowed event is still written to the log -- it just does not interrupt you.
# `audiowatch --tail` shows suppressed events with "(allowed by ...)".
# ---------------------------------------------------------------------------

# Where the append-only log goes.
log ~/Library/Logs/audiowatch/audiowatch.log

# Post a macOS notification when a non-allowed process starts output.
notify on

# Also notify when a process merely connects to the audio HAL, before it has
# made any sound. Noisy in normal use -- but connecting is the one thing a
# short-lived process cannot avoid doing, so turn this on if something is
# slipping past. It is logged either way.
notify-connect off

# Also notify when a process starts capturing input (microphone).
notify-input off

# How often to sample every process's output flag. CoreAudio does not send
# change notifications for kAudioProcessPropertyIsRunningOutput, so it must be
# polled; this is what catches a process that plays for a fraction of a second.
# Measured at 50ms on this machine: about 0.7% of one core, 13 MB resident.
# Raise it to spend less, lower it for more margin on very brief sounds.
poll-ms 50

# When a device reports that IO started, sample this fast for this long, to pin
# down which process it was.
fast-poll-ms 10
fast-window-ms 2000


# ===========================================================================
# Allow-list: things that are supposed to make sound.
# ===========================================================================

# --- this tool's own notification mechanism, so it can never chase itself ---
allow-exe audiowatch
allow-path /usr/bin/osascript

# --- browsers (and their audio helper processes, which have no bundle id) ---
allow-bundle com.google.Chrome*
allow-path /Applications/Google Chrome.app/*
allow-path */Google Chrome.app.bundle/*
allow-bundle com.apple.Safari*
allow-bundle com.apple.WebKit*
allow-bundle org.mozilla.firefox*
allow-path /Applications/Firefox.app/*
allow-bundle company.thebrowser.Browser
allow-bundle com.brave.Browser*
allow-bundle com.microsoft.edgemac*

# --- music and video players ---
allow-bundle com.spotify.client
allow-path /Applications/Spotify.app/*
allow-bundle com.apple.Music
allow-bundle com.apple.iTunes
allow-bundle com.apple.TV
allow-bundle com.apple.podcasts
allow-bundle com.apple.QuickTimePlayerX
allow-bundle org.videolan.vlc
allow-bundle com.colliderli.iina

# --- calls and chat ---
allow-bundle us.zoom.xos
allow-bundle com.tinyspeck.slackmacgap
allow-bundle com.hnc.Discord
allow-path /Applications/Discord.app/*
allow-bundle com.microsoft.teams*
allow-bundle com.apple.FaceTime
allow-bundle com.apple.iChat
allow-bundle net.whatsapp.WhatsApp*
allow-path /Applications/WhatsApp.app/*


# ===========================================================================
# NOT allowed by default, on purpose.
#
# Each of these is a plausible source of an unexplained pop, so audiowatch
# tells you about them. Uncomment a line only once you are satisfied it is not
# the thing you are hunting.
#
# systemsoundserverd plays UI and alert sounds ON BEHALF OF other processes,
# so it is the name you will see instead of whoever actually asked for it.
# allow-path /usr/sbin/systemsoundserverd
#
# PowerChime is the sound made when a charger is plugged in.
# allow-path /System/Library/CoreServices/PowerChime.app/*
#
# Virtual routing drivers. These hold an output stream open permanently, which
# means audiowatch sees no transition when audio passes THROUGH them -- see the
# "What still gets past it" section of the README.
# allow-path /Library/Audio/Plug-Ins/HAL/ARK.driver/*
# allow-path /Applications/Loopback.app/*
# allow-exe jackd
#
# Your own audio work, once you are tired of seeing it.
# allow-exe flux-gui
# allow-exe nexus

# ── ancestry ────────────────────────────────────────────────────────────────
#
# `allow-ancestor` matches any process *above* the one making the sound, by file
# name or by path. This is the rule to reach for when a helper is innocent but
# its name is not: `afplay` is how half the machine plays a sound, so excusing
# `afplay` would hide everything. Excusing what *started* it does not.
#
# Uncomment this to stop your own agent sessions notifying you, while a stray
# afplay from anywhere else still does:
# allow-ancestor claude
